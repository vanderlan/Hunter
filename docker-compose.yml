services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:80"
    container_name: hunter-api
    depends_on:
      - postgresql
      - elasticsearch
    networks:
      - backend-network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "5200:80"
    container_name: hunter-frontend
    depends_on:
      - api
    networks:
      - backend-network

  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: HunterDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123PgSql"
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
        - backend-network

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: unless-stopped
    environment: 
      - 'CLI_JAVA_OPTS=-Xms1g -Xmx1g'
      - 'bootstrap.memory_lock=true'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'xpack.security.enrollment.enabled=false'
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.10.2
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    networks:
      - backend-network

networks:
    backend-network:
        driver: bridge
  
volumes:
    elasticsearch-data:
    postgresql-data: