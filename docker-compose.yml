services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:80"
    container_name: hunter-api
    depends_on:
      - postgresql
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSql=Host=postgresql;Port=5432;Database=HunterDev;Username=postgres;Password=123PgSql
      - AI__Provider=${AI_PROVIDER:-OpenAI}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o}
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY}
      - DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}
      - JobScraper__CareersUrl=${CAREERS_URL:-https://taller.applytojob.com/apply/}
      - Email__SmtpHost=${SMTP_HOST}
      - Email__SmtpPort=${SMTP_PORT:-587}
      - Email__FromEmail=${FROM_EMAIL}
      - Email__ToEmails__0=${TO_EMAIL}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__EnableSsl=${EMAIL_ENABLE_SSL:-true}
      - Email__ApplicationUrl=${APP_URL:-http://localhost:5200}
      - NEW_RELIC_LICENSE_KEY=88c9223c371e67d2f21b07be5d622589FFFFNRAL
      - NEW_RELIC_APP_NAME=Hunter
      - CORECLR_ENABLE_PROFILING=1
      - CORECLR_PROFILER={36032161-FFC0-4B61-B559-F6C5D41BAE5A}
      - CORECLR_NEWRELIC_HOME=/app/newrelic
      - CORECLR_PROFILER_PATH=/app/newrelic/libNewRelicProfiler.so
    networks:
      - backend-network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "5200:80"
    container_name: hunter-frontend
    depends_on:
      - api
    networks:
      - backend-network

  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: HunterDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123PgSql"
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
        - backend-network

networks:
    backend-network:
        driver: bridge
  
volumes:
postgresql-data: