services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:80"
    container_name: hunter-api
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSql=Host=postgresql;Port=5432;Database=HunterDev;Username=postgres;Password=123PgSql
      - JwtOptions__SymmetricSecurityKey=${JWT_SECRET_KEY:-local-dev-only-jwt-signing-key-change-me-0123456789abcdef-0123456789abcdef-0123456789abcdef}
      - JwtOptions__Issuer=Hunter API
      - JwtOptions__Audience=http://localhost:5200
      - AI__Provider=${AI_PROVIDER:-OpenAI}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o}
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY:-}
      - DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}
      - JobScraper__CareersUrl=${CAREERS_URL:-https://taller.applytojob.com/apply/}
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__SmtpLogin=${EMAIL_SMTP_LOGIN:-}
      - Email__FromEmail=${EMAIL_FROM:-noreply@hunter.local}
      - Email__ToEmails__0=${EMAIL_TO:-noreply@hunter.local}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__EnableSsl=${EMAIL_ENABLE_SSL:-true}
      - Email__ApplicationUrl=${APP_URL:-http://localhost:5200}
      # New Relic APM disabled for local runs (the Dockerfile enables it by default)
      - CORECLR_ENABLE_PROFILING=0
    networks:
      - backend-network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        FRONTEND_CONFIGURATION: beta # apiUrl http://localhost:5010
    ports:
      - "5200:80"
    container_name: hunter-frontend
    depends_on:
      - api
    networks:
      - backend-network

  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: HunterDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123PgSql"
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
        - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HunterDev"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
    backend-network:
        driver: bridge
  
volumes:
  postgresql-data: