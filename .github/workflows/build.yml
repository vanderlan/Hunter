name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
env:
  ASPNETCORE_ENVIRONMENT: Test
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16.3
        env:
          POSTGRES_DB: HunterTests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123PgSql
        ports:
          - "5432:5432"
    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install EF Core Tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Build and test backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet restore Hunter.sln
          dotnet ef database update -p src/GeminiCode.Hunter.Infra.Data -s src/GeminiCode.Hunter.Api --verbose
          dotnet build Hunter.sln
          dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=coverage /p:Exclude=[xunit.*]* Hunter.sln
          cp tests/GeminiCode.Hunter.Test/coverage.opencover.xml opencover.xml
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./front-end
        run: npm install --legacy-peer-deps
      
      - name: Build frontend
        working-directory: ./front-end
        run: npm run build -- --configuration=production
      