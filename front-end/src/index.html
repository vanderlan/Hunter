<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hunter</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" type="image/x-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter: the single product typeface, variable weight 400-700. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <script>
    // Apply the stored theme before first paint to avoid a flash of the
    // wrong scheme on load. Light is the default, so only dark needs opting in.
    (function () {
      try {
        var stored = localStorage.getItem('hunter_theme');
        if (stored === 'dark') {
          document.documentElement.classList.add('hunter-dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { /* storage unavailable; fall back to the light default */ }
    })();
  </script>
</head>
<body class="light-theme">
  <app-root></app-root>
</body>
</html>
