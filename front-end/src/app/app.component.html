<div class="app-container">
  @if (isAuthenticated$ | async) {
    <mat-toolbar color="primary" class="app-toolbar">
      <span class="toolbar-brand">
        <mat-icon>work</mat-icon>
        <span class="brand-text">Hunter CV Analyzer</span>
      </span>
      <span class="toolbar-spacer"></span>
      <button mat-button routerLink="/" class="nav-button">
        <mat-icon>analytics</mat-icon>
        <span>Analyze CV</span>
      </button>
      <button mat-button routerLink="/candidates" class="nav-button">
        <mat-icon>folder_shared</mat-icon>
        <span>Candidates</span>
      </button>
      @if (isAdmin()) {
        <button mat-button routerLink="/job-positions" class="nav-button">
          <mat-icon>settings</mat-icon>
          <span>Job Positions</span>
        </button>
        <button mat-button routerLink="/users" class="nav-button">
          <mat-icon>people</mat-icon>
          <span>Users</span>
        </button>
      }
      <button mat-icon-button [matMenuTriggerFor]="menu" class="user-menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <div class="menu-user-info">
          <mat-icon>person</mat-icon>
          <span>{{ getUserName() }}</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="changePassword()">
          <mat-icon>lock</mat-icon>
          <span>Change Password</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>
  }
  
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
