<div class="app-container" [class.sidenav-expanded]="sidenavExpanded">
  @if (isAuthenticated$ | async) {
    <!-- Left Sidebar -->
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav
        #sidenav
        mode="side"
        [opened]="sidenavExpanded"
        class="app-sidenav">

        <!-- Brand/Logo -->
        <div class="sidenav-header">
          <div class="brand-container">
            <mat-icon class="brand-icon">work</mat-icon>
            @if (sidenavExpanded) {
              <span class="brand-text">Hunter</span>
            }
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidenav-nav">
          <button mat-button
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item">
            <mat-icon>analytics</mat-icon>
            @if (sidenavExpanded) {
              <span>Analyze CV</span>
            }
          </button>

          <button mat-button routerLink="/open-positions" routerLinkActive="active" class="nav-item">
            <mat-icon>work_outline</mat-icon>
            @if (sidenavExpanded) {
              <span>Open Positions</span>
            }
          </button>

          <button mat-button routerLink="/candidates" routerLinkActive="active" class="nav-item">
            <mat-icon>folder_shared</mat-icon>
            @if (sidenavExpanded) {
              <span>Candidates</span>
            }
          </button>

          <button mat-button routerLink="/hiring-process" routerLinkActive="active" class="nav-item">
            <mat-icon>track_changes</mat-icon>
            @if (sidenavExpanded) {
              <span>{{ getReferralsLabel() }}</span>
            }
          </button>

          @if (isAdmin()) {
            @if (sidenavExpanded) {
              <mat-divider></mat-divider>
            }
            @if (sidenavExpanded) {
              <div class="section-label">ADMIN</div>
            }

            <button mat-button routerLink="/admin" routerLinkActive="active" class="nav-item">
              <mat-icon>admin_panel_settings</mat-icon>
              @if (sidenavExpanded) {
                <span>Admin Panel</span>
              }
            </button>

            <button mat-button routerLink="/job-positions" routerLinkActive="active" class="nav-item">
              <mat-icon>work</mat-icon>
              @if (sidenavExpanded) {
                <span>Job Positions</span>
              }
            </button>

            <button mat-button routerLink="/users" routerLinkActive="active" class="nav-item">
              <mat-icon>people</mat-icon>
              @if (sidenavExpanded) {
                <span>Users</span>
              }
            </button>
          }
        </nav>

        <!-- Spacer to push user menu to bottom when expanded -->
        @if (sidenavExpanded) {
          <div class="sidenav-spacer"></div>
        }
      </mat-sidenav>

      <!-- Main Content Area -->
      <mat-sidenav-content class="main-content">
        <!-- Top Bar with Toggle Button and User Menu -->
        <div class="top-bar">
          <button mat-icon-button (click)="toggleSidenav()" class="toggle-button">
            <mat-icon>{{ sidenavExpanded ? 'menu_open' : 'menu' }}</mat-icon>
          </button>
          <span class="page-title">{{ getPageTitle() }}</span>

          <!-- Spacer -->
          <span class="toolbar-spacer"></span>

          <!-- User Menu (Top Right) -->
          <span class="username-display">{{ getUserName() }}</span>
          <button mat-icon-button [matMenuTriggerFor]="menu" class="user-menu-button">
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="preferences()">
              <mat-icon>settings</mat-icon>
              <span>Preferences</span>
            </button>
            <button mat-menu-item (click)="changePassword()">
              <mat-icon>lock</mat-icon>
              <span>Change Password</span>
            </button>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>

        <!-- Router Content -->
        <main class="app-content">
          <router-outlet></router-outlet>
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>
  }

  @else {
  <!-- Login/Unauthenticated Content (Centered) -->
  <div class="unauthenticated-wrapper">
    <router-outlet></router-outlet>
  </div>
}
</div>
