services:
  api:
    image: vanderlangs/hunter-api:latest
    ports:
      - "5010:80"
    container_name: hunter-api
    restart: unless-stopped
    depends_on:
      - postgresql
      - elasticsearch
    networks:
      - backend-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSql=Host=postgresql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtOptions__SymmetricSecurityKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__TokenExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - Email__SmtpHost=${EMAIL_SMTP_HOST}
      - Email__SmtpPort=${EMAIL_SMTP_PORT}
      - Email__FromEmail=${EMAIL_FROM}
      - Email__ToEmails__0=${EMAIL_TO}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__EnableSsl=${EMAIL_ENABLE_SSL}
      - ElasticConfiguration__Uri=${ELASTICSEARCH_URI}
      - JobScraper__CareersUrl=${JOB_SCRAPER_URL}
      - FeatureManagement__AutoCandidateMatching=${FEATURE_AUTO_CANDIDATE_MATCHING}
      - AllowedHosts=${ALLOWED_HOSTS}

  frontend:
    image: vanderlangs/hunter-frontend:latest
    ports:
      - "5200:80"
    container_name: hunter-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - backend-network

  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
        - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: unless-stopped
    environment: 
      - 'CLI_JAVA_OPTS=-Xms1g -Xmx1g'
      - 'bootstrap.memory_lock=true'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'xpack.security.enrollment.enabled=false'
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.10.2
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    networks:
      - backend-network

networks:
    backend-network:
        driver: bridge
  
volumes:
    elasticsearch-data:
    postgresql-data:
