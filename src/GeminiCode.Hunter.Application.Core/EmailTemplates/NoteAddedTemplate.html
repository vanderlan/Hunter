                    <div class="info-box">
                        <h3>Update Notification</h3>
                        <p>An administrator has added a new note to the hiring process. This may contain important updates or next steps.</p>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">&#128100;</span>Candidate Information
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Name:</span>
                            <span class="detail-value">{{CandidateName}}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Position:</span>
                            <span class="detail-value">{{JobTitle}}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">&#128172;</span>New Note
                        </div>
                        <div class="note-content">
                            <div class="note-header">
                                <span class="note-icon">&#128204;</span>
                                <span class="note-author">{{AddedByUserName}}</span>
                            </div>
                            <p class="note-text">{{NoteText}}</p>
                        </div>
                    </div>

                    <div class="cta-section">
                        <a href="{{ApplicationUrl}}" class="cta-button">View in Hunter</a>
                    </div>
