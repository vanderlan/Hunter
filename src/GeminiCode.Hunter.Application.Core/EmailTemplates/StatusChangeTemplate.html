                    <div class="status-change-box">
                        <h3>Status Changed</h3>
                        <div class="status-flow">
                            <span class="status-badge old">{{OldStatus}}</span>
                            <span class="status-arrow">&#8594;</span>
                            <span class="status-badge new">{{NewStatus}}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">&#128100;</span>Candidate Information
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Name:</span>
                            <span class="detail-value">{{CandidateName}}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Position:</span>
                            <span class="detail-value">{{JobTitle}}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">&#128203;</span>Update Details
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Changed By:</span>
                            <span class="detail-value">{{ChangedByUserName}}</span>
                        </div>
                    </div>

                    {{#if HasNotes}}
                    <div class="notes-box">
                        <h4>&#128172; Notes from Administrator</h4>
                        <p>{{Notes}}</p>
                    </div>
                    {{/if}}

                    <div class="cta-section">
                        <a href="{{ApplicationUrl}}" class="cta-button">View Details in Hunter</a>
                    </div>
