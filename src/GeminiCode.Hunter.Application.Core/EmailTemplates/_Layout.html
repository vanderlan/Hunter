<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{EmailTitle}}</title>
    <!--
        Hunter email layout — the single source of truth for email styling.
        Every template is a content fragment rendered into {{Content}} below.

        Palette mirrors front-end/src/styles/_tokens.scss ("Signal": cool
        slate neutrals + precision teal). Red appears only for errors and the
        Reproved state — never as brand or chrome.
        Email deliberately uses literal hex rather than CSS custom properties:
        Outlook's Word rendering engine does not support var().
    -->
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        table { border-collapse: collapse; }
        img { border: 0; line-height: 100%; vertical-align: middle; }
        a { color: #0d7d72; }

        .email-outer {
            width: 100%;
            background-color: #f8fafc;
            padding: 24px 12px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        /* --- Header: flat brand band. No gradient anywhere in the system. --- */
        .header {
            background: #0d7d72;
            color: #ffffff;
            padding: 36px 32px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: #ffffff;
        }
        .header p {
            margin: 8px 0 0 0;
            font-size: 14px;
            color: #ffffff;
            opacity: 0.82;
        }

        .content { padding: 32px; }

        /* --- Sections --- */
        .section { margin-bottom: 28px; }
        .section-title {
            color: #0f172a;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: -0.2px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .section-subtitle {
            color: #55657a;
            font-size: 13px;
            margin: 0 0 12px 0;
        }
        .section-icon {
            display: inline-block;
            margin-right: 8px;
            font-size: 18px;
        }

        /* --- Detail rows --- */
        .detail-row {
            padding: 12px 14px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-left: 3px solid #0d7d72;
            border-radius: 6px;
        }
        .detail-label {
            font-weight: 600;
            color: #0f172a;
            display: inline-block;
            min-width: 110px;
        }
        .detail-value { color: #55657a; }

        /* --- Callouts: one shape, four tones, matching the app's status tokens --- */
        .info-box, .notes-box, .warning-box, .summary-box,
        .highlight-box, .credentials-box, .empty-state,
        .status-change-box, .referral-reason, .cancel-reason, .note-content {
            padding: 18px;
            margin: 0 0 20px 0;
            border-radius: 8px;
            border: 1px solid #c5daf7;
            border-left: 4px solid #1b5fb8;
            background-color: #e8f1fd;
            color: #0f172a;
        }
        .info-box h3, .info-box h4,
        .status-change-box h3,
        .note-content h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 650; color: #1b5fb8; }

        .notes-box, .highlight-box {
            background-color: #fdf3e3;
            border-color: #f2dcb2;
            border-left-color: #8f5a05;
        }
        .notes-box h4, .highlight-box h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 650; color: #8f5a05; }

        .warning-box, .cancel-reason {
            background-color: #fdecec;
            border-color: #f4c7c4;
            border-left-color: #c0271f;
        }
        .warning-box h3, .warning-box h4,
        .cancel-reason h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 650; color: #c0271f; }

        .summary-box, .referral-reason {
            background-color: #e8f6ed;
            border-color: #b9e3c8;
            border-left-color: #116a3a;
        }
        .summary-box h3, .referral-reason h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 650; color: #116a3a; }

        .credentials-box, .empty-state {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            border-left-color: #0d7d72;
        }
        .empty-state { text-align: center; color: #55657a; }

        .info-box p, .notes-box p, .warning-box p, .summary-box p,
        .highlight-box p, .credentials-box p, .referral-reason p,
        .cancel-reason p, .note-content p { margin: 0; font-size: 14px; line-height: 1.6; }

        /* --- Status flow --- */
        .status-change-box { text-align: center; }
        .status-flow { margin: 14px 0 0 0; }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: #ffffff;
            border-radius: 999px;
            font-weight: 600;
            font-size: 13px;
            margin: 0 4px;
        }
        .status-badge.old { color: #55657a; border: 1px solid #cbd5e1; }
        .status-badge.new { color: #1b5fb8; border: 1px solid #1b5fb8; }
        .status-arrow { font-size: 18px; color: #1b5fb8; font-weight: 700; margin: 0 6px; }

        /* --- Notes --- */
        .note-header { margin-bottom: 8px; }
        .note-icon { margin-right: 6px; }
        .note-author { font-weight: 600; color: #0f172a; font-size: 14px; }
        .note-text { color: #0f172a; font-size: 14px; line-height: 1.6; margin: 0; }

        /* --- Job + candidate lists --- */
        .job-list { margin: 0; padding: 0; list-style: none; }
        .job-item {
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #0d7d72;
            border-radius: 12px;
        }
        .job-item.new { border-left-color: #116a3a; }
        .job-item.closed { border-left-color: #c0271f; }
        .job-item-icon { margin-right: 8px; }
        .job-item-title-link { color: #0f172a; font-weight: 600; text-decoration: none; }
        .job-item-title-link:hover { text-decoration: underline; }

        .position-section { margin-bottom: 28px; }
        .position-header {
            font-size: 16px;
            font-weight: 650;
            color: #0f172a;
            padding-bottom: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid #e2e8f0;
        }
        .candidates-container { margin: 0; }
        .candidate-card {
            padding: 16px;
            margin-bottom: 10px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
        .candidate-header { margin-bottom: 8px; }
        .candidate-name { font-weight: 650; color: #0f172a; font-size: 15px; }
        .candidate-info { color: #55657a; font-size: 13px; }
        .match-reason { color: #55657a; font-size: 13px; line-height: 1.6; margin: 8px 0 0 0; }
        .more-candidates { color: #55657a; font-size: 13px; text-align: center; margin-top: 12px; }

        /* Match badges reuse the status palette */
        .match-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background-color: #f1f5f9;
            color: #55657a;
            border: 1px solid #e2e8f0;
        }
        .match-badge.high, .match-badge.excellent {
            background-color: #e8f6ed; color: #116a3a; border-color: #b9e3c8;
        }
        .match-badge.medium, .match-badge.good {
            background-color: #fdf3e3; color: #8f5a05; border-color: #f2dcb2;
        }
        .match-badge.low {
            background-color: #fdecec; color: #c0271f; border-color: #f4c7c4;
        }

        /* --- Welcome features --- */
        .welcome-message { font-size: 15px; color: #0f172a; margin-bottom: 20px; }
        .features-section { margin: 20px 0; }
        .feature-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }
        .emoji-icon { margin-right: 8px; }

        /* --- CTA --- */
        .cta-section { text-align: center; margin-top: 28px; }
        .cta-button {
            display: inline-block;
            padding: 13px 28px;
            background-color: #0d7d72;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
        }

        /* --- Footer --- */
        .footer {
            background-color: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            color: #55657a;
            padding: 24px 32px;
            text-align: center;
            font-size: 13px;
        }
        .footer p { margin: 4px 0; }
        .footer .footer-brand { color: #0f172a; font-weight: 650; font-size: 14px; }

        /* ------------------------------------------------------------------
           Dark mode — same tokens, dark surfaces. Honoured by Apple Mail,
           iOS Mail and Outlook.com; other clients keep the light treatment.
           ------------------------------------------------------------------ */
        @media (prefers-color-scheme: dark) {
            body, .email-outer { background-color: #0b0f14 !important; color: #e2e8f0 !important; }
            .email-container { background-color: #0f172a !important; border-color: #212a35 !important; }
            .header { background: #0b6961 !important; }

            .section-title, .position-header { color: #e2e8f0 !important; border-bottom-color: #212a35 !important; }
            .section-subtitle, .detail-value, .candidate-info, .match-reason,
            .more-candidates, .empty-state, .footer { color: #92a2b6 !important; }
            .detail-label, .note-author, .note-text, .candidate-name,
            .welcome-message, .footer .footer-brand { color: #e2e8f0 !important; }

            .detail-row, .feature-item, .credentials-box, .empty-state {
                background-color: #11161d !important; border-color: #212a35 !important;
            }
            .job-item, .candidate-card, .status-badge {
                background-color: #11161d !important; border-color: #212a35 !important;
            }
            .footer { background-color: #0b0f14 !important; border-top-color: #212a35 !important; }

            .info-box, .status-change-box, .note-content {
                background-color: #0e1d33 !important; border-color: #1f3c69 !important; color: #e2e8f0 !important;
            }
            .info-box h3, .info-box h4, .status-change-box h3, .note-content h4,
            .status-badge.new, .status-arrow { color: #90c2fb !important; }
            .status-badge.new { border-color: #90c2fb !important; }

            .notes-box, .highlight-box {
                background-color: #2a1f09 !important; border-color: #513c10 !important; color: #e2e8f0 !important;
            }
            .notes-box h4, .highlight-box h4 { color: #f0ba63 !important; }

            .warning-box, .cancel-reason {
                background-color: #2a1113 !important; border-color: #56201f !important; color: #e2e8f0 !important;
            }
            .warning-box h3, .warning-box h4, .cancel-reason h4 { color: #fb9b95 !important; }

            .summary-box, .referral-reason {
                background-color: #0c2417 !important; border-color: #1b4730 !important; color: #e2e8f0 !important;
            }
            .summary-box h3, .referral-reason h4 { color: #5fd18d !important; }

            .job-item-title-link { color: #e2e8f0 !important; }
            .status-badge.old { color: #92a2b6 !important; border-color: #2e3a48 !important; }
            a { color: #2dd4bf !important; }
            .cta-button { background-color: #0d7d72 !important; color: #ffffff !important; }

            .match-badge { background-color: #1a222c !important; color: #92a2b6 !important; border-color: #2b3643 !important; }
            .match-badge.high, .match-badge.excellent { background-color: #0c2417 !important; color: #5fd18d !important; border-color: #1b4730 !important; }
            .match-badge.medium, .match-badge.good { background-color: #2a1f09 !important; color: #f0ba63 !important; border-color: #513c10 !important; }
            .match-badge.low { background-color: #2a1113 !important; color: #fb9b95 !important; border-color: #56201f !important; }
        }

        @media only screen and (max-width: 600px) {
            .content { padding: 24px 20px; }
            .header { padding: 28px 20px; }
            .footer { padding: 20px; }
            .detail-label { min-width: 0; display: block; margin-bottom: 2px; }
        }
    </style>
</head>
<body>
    <div class="email-outer">
        <div class="email-container">
            <div class="header">
                <h1>{{EmailTitle}}</h1>
                <p>{{EmailSubtitle}}</p>
            </div>

            <div class="content">
{{Content}}
            </div>

            <div class="footer">
                <p class="footer-brand">Hunter</p>
                <p>AI-Powered Candidate Matching Platform</p>
                <p>This is an automated email. Please do not reply.</p>
            </div>
        </div>
    </div>
</body>
</html>
